name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      milestone:
        description: GitHub milestone to publish
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag --annotate "v$VERSION" --message "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Install GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4.7.0
        with:
          versionSpec: 0.20.x

      - name: Create release
        uses: gittools/actions/gitreleasemanager/create@v4.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: okram78/vahti.nvim
          milestone: ${{ inputs.milestone || steps.gitversion.outputs.majorMinorPatch }}
          name: v${{ steps.gitversion.outputs.majorMinorPatch }}

      - name: Publish release
        uses: gittools/actions/gitreleasemanager/publish@v4.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: okram78/vahti.nvim
          milestone: ${{ inputs.milestone || steps.gitversion.outputs.majorMinorPatch }}
